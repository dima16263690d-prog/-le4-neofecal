name: Build CLEO ASI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "builds/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout CLEO
        uses: actions/checkout@v4

      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          path: plugin-sdk-master
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release GTASA Win32
        shell: cmd
        run: msbuild CLEO4.sln /m /p:Configuration="Release GTASA" /p:Platform=Win32

      - name: Verify CLEO.asi
        shell: powershell
        run: |
          $file = "output\Release\CLEO.asi"
          if (!(Test-Path $file)) {
            throw "Build did not produce $file"
          }
          Get-Item $file | Format-List FullName,Length,LastWriteTime

      - name: Publish CLEO.asi into repository
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "builds" | Out-Null
          Copy-Item "output\Release\CLEO.asi" "builds\CLEO.asi" -Force

      - name: Commit built CLEO.asi
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/CLEO.asi
          if git diff --cached --quiet; then
            echo "CLEO.asi unchanged"
            exit 0
          fi
          git commit -m "Build Release CLEO.asi"
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLEO-ASI-Release-GTASA-Win32
          path: output/Release/CLEO.asi
          if-no-files-found: error
